syntax = "proto3";

package dc;

// =====================================================================
// Drive controller serial protocol (Teensy <-> Web console).
// Wire format: COBS-encoded frames terminated by 0x00. Each payload is
// [protobuf bytes][CRC16-CCITT-FALSE 2byte LE]. The protobuf bytes encode
// either a HostToDevice or DeviceToHost message depending on direction.
// =====================================================================

enum EtcMode {
  ETC_MODE_UNSPECIFIED = 0;
  ETC_MODE_CALIB       = 1;
  ETC_MODE_NORMAL      = 2;
  ETC_MODE_RESTRICT    = 3;
  ETC_MODE_MOTOR_OFF   = 4;
}

// ---------------------------------------------------------------------
// Shared sub-messages
// ---------------------------------------------------------------------

enum TransmissionType {
  TRANSMISSION_IST    = 0;
  TRANSMISSION_NORMAL = 1;
}

message GpsCalib {
  TransmissionType type              = 1;
  repeated uint32  ist_raw_values    = 2;  // max_count:5 (N,1,2,3,4)
  repeated uint32  normal_raw_values = 3;  // max_count:7 (1,N,2,3,4,5,6)
}

message SensorCalib {
  uint32   apps1_min                = 1;
  uint32   apps1_max                = 2;
  uint32   apps2_min                = 3;
  uint32   apps2_max                = 4;
  uint32   ittr_min                 = 5;
  uint32   ittr_max                 = 6;
  uint32   tps1_min                 = 7;
  uint32   tps1_max                 = 8;
  uint32   tps2_min                 = 9;
  uint32   tps2_max                 = 10;
  float    target_tp_idling         = 11;
  float    target_tp_normal_max     = 12;
  float    target_tp_restricted_max = 13;
  uint32   wheel_rotor_teeth_front  = 14;
  uint32   wheel_rotor_teeth_rear   = 15;
  uint32   engine_teeth             = 16;
  uint32   clutch_min               = 17;
  uint32   clutch_max               = 18;
  GpsCalib gps                      = 19;
}

message EtcPlausibilityCheckFlags {
  bool apps    = 1;
  bool tps     = 2;
  bool apps1   = 3;
  bool apps2   = 4;
  bool tps1    = 5;
  bool tps2    = 6;
  bool target  = 7;
  bool bps     = 8;
  bool bps_tps = 9;
}

message EtcPid {
  float k_p = 1;
  float k_i = 2;
  float k_d = 3;
}

message EtcTargetCurve {
  // 結構細かい数字なので double
  double a4 = 1;
  double a3 = 2;
  double a2 = 3;
  double a1 = 4;
}

message EtcConfig {
  EtcPlausibilityCheckFlags plausibility_check_flags = 1;
  bool                      use_ittr                 = 2;
  EtcPid                    pid                      = 3;
  EtcTargetCurve            target_curve             = 4;
}

message LaunchConfig {
  reserved 4;                            // 旧 initial_engagement (continuous start 化で廃止)
  reserved "initial_engagement";
  float  launch_rpm_threshold     = 1;  // Ready→Approach: エンジン回転数閾値 (RPM)
  float  clutch_depress_threshold = 2;  // Ready→Approach: クラッチ位置 < この値 (0-100%)
  float  approach_speed_pct_per_s = 3;  // Approach: クラッチ締結速度 (%/s)
  float  engagement_ramp_rate     = 5;  // 目標締結率の上昇速度 (/s)。EngageControl 突入時の実締結率から ramp
  EtcPid engagement_pid           = 6;  // 締結率誤差 → クラッチ位置指令
  EtcPid inner_pid                = 7;  // クラッチ位置指令 → モーター (ClutchMotor内)
  float  bite_point_margin        = 8;  // Approach目標 = bitePoint - margin (%)
  float  creep_speed_pct_per_s    = 9;  // マージン到達後の微速前進速度 (%/s)
  float  slip_detect_threshold    = 10; // スリップ検出閾値 (0.0-1.0)
  uint32 slip_detect_debounce     = 11; // スリップ検出デバウンス (連続ティック数)
  float  bite_point_ema_alpha     = 12; // EMA平滑係数 (0.0-1.0, 大→新値重視)
  float  gear_ratio               = 13; // 1速ギア比
  float  final_drive_ratio        = 14; // 最終減速比
}

message TractionConfig {
}

// オートシフター設定。詳細は dc-firmware/auto_shifter_spec.md。
message AutoShiftConfig {
  float  upshift_rpm             = 1;  // UP しきい値 (RPM)
  float  downshift_rpm           = 2;  // DOWN しきい値 (RPM)
  float  min_wheel_hz            = 3;  // 停止/走行 境界 (兼 ON 時の停車抑止しきい)
  uint32 cooldown_ms             = 4;  // シフト間ロックアウト (両モード)
  uint32 ist_pulse_ms            = 5;  // IST: 全シフト共通パルス幅 (ms)
  uint32 normal_drive_pulse_ms   = 6;  // NORMAL 走行中/通常: N スキップ (ms)
  uint32 normal_neutral_pulse_ms = 7;  // NORMAL 停車中 1速UP/2速DOWN: N 入れ (ms)
  float  throttle_on_pct         = 8;  // この APPS% 以上=アクセルオン(UP可) / 未満=オフ(DOWN可)
}

// Stored separately in /bite_point.pb — learned clutch meet point
message BitePoint {
  float position = 1;  // 0-100%
}

message Config {
  SensorCalib     sensor_calib = 1;
  EtcConfig       etc          = 2;
  LaunchConfig    launch       = 3;
  TractionConfig  traction     = 4;
  AutoShiftConfig auto_shift   = 5;
}

// ---------------------------------------------------------------------
// Device -> Host
// ---------------------------------------------------------------------

message EtcState{
  EtcMode mode   = 1;
  bool    manual = 2;
  bool    valid  = 3;
  uint32  errors = 4;  // bitmask: bit0=apps, 1=tps, 2=apps1, 3=apps2, 4=tps1, 5=tps2, 6=target, 7=bps, 8=bps_tps
  bool    ittr   = 5;  // ターゲットが ITTR(CAN指令)由来か (false=APPS)。console のライブ表示用
  float   duty   = 6;  // モーター実印加 duty [%] (符号=駆動方向, ±100 で飽和, ETC 停止中は 0)
}

message Sensor{
  uint32 sps       = 1;
  uint32 apps1_raw = 2;
  uint32 apps2_raw = 3;
  uint32 ittr_raw  = 4;
  uint32 tps1_raw  = 5;
  uint32 tps2_raw  = 6;
  uint32 bps_raw   = 7;

  float apps1 = 8;
  float apps2 = 9;
  float ittr  = 10;
  float tps1  = 11;
  float tps2  = 12;
  float bps   = 13;

  float target_tp = 14;

  float accel_x = 15;
  float accel_y = 16;
  float accel_z = 17;
  float gyro_x  = 18;
  float gyro_y  = 19;
  float gyro_z  = 20;

  float wheel_speed_fl = 21;
  float wheel_speed_fr = 22;
  float wheel_speed_rl = 23;
  float wheel_speed_rr = 24;
  float rpm            = 25;

  uint32 wheel_count_fl = 26;
  uint32 wheel_count_fr = 27;
  uint32 wheel_count_rl = 28;
  uint32 wheel_count_rr = 29;
  uint32 rpm_count      = 30;

  uint32 gps_raw = 31;  // Gear Position Sensor raw ADC value
  sint32 gear    = 32;  // detected gear (-1=unknown, 0=N, 1-6)

  uint32 clutch_raw = 33;  // Clutch Position Sensor raw ADC value
  float  clutch     = 34;  // clutch position 0-100 (0=fully open, 100=fully closed)

  float clutch_rpm = 35;  // クラッチ後(出力軸)の回転 [Hz] (engine_teeth と同様に要換算)
}

// loop() / SD / 安全層 ISR の所要時間 (直近に完了した 1 s 窓)。docs/loop_nonblocking_spec.md §5
message SysStats {
  uint32 loop_max_us      = 1;  // loop 1 周の最大 [µs]
  uint32 loop_mean_us     = 2;  // 平均
  uint32 sd_max_us        = 3;  // SD write/flush 1 回の最大
  uint32 safety_max_us    = 4;  // 安全層 ISR 1 回の最大 (Phase 2 以降、それまで 0)
  uint32 log_drops        = 5;  // リング溢れ累積 (Phase 3 以降、それまで 0)
  uint32 loop_max_us_boot = 6;  // 起動以来の loop 1 周の最大
}

// 制御入力 (コックピットスイッチ) の受信状態。docs/control_input_spec.md
message ControlStatus {
  enum Source {
    CONTROL_SOURCE_UNSPECIFIED     = 0;
    CONTROL_SOURCE_WAITING_FOR_CAN = 1;  // 起動後 0x740 未受信 (ETC は MOTOR_OFF で待機)
    CONTROL_SOURCE_CAN             = 2;  // CAN 0x740 / 0x741 (途絶時はフォールバック値)
    CONTROL_SOURCE_OVERRIDE        = 3;  // console からの上書き (ベンチ用)
  }
  Source  source             = 1;
  bool    control_link_alive = 2;  // 0x740 を 200 ms 以内に受信
  bool    shift_link_alive   = 3;  // 0x741 を 100 ms 以内に受信
  uint32  control_rx_age_ms  = 4;  // 最後に 0x740 を受信してからの経過 (未受信は 0)
  EtcMode can_etc_mode       = 5;  // CAN 側の ETC モード (未受信は UNSPECIFIED)
  bool    can_auto_shift     = 6;  // CAN 側のオートシフト
  bool    auto_shift_on      = 7;  // 適用中のオートシフト (override 込み)
}

message State {
  uint32 timestamp = 1;

  Sensor        sensor  = 2;
  EtcState      etc     = 3;
  SysStats      sys     = 4;
  ControlStatus control = 5;
}

message DebugMessage {
  uint32 timestamp = 1;
  string msg       = 2;
}

// Per-command response payloads. Each command picks the payload it cares
// about (or none).
message AppsMinResponse {
  uint32 apps1_min = 1;
  uint32 apps2_min = 2;
  uint32 ittr_min  = 3;
}

message AppsMaxResponse {
  uint32 apps1_max = 1;
  uint32 apps2_max = 2;
  uint32 ittr_max  = 3;
}

message TpsMinResponse {
  uint32 tps1_min = 1;
  uint32 tps2_min = 2;
}

message TpsMaxResponse {
  uint32 tps1_max = 1;
  uint32 tps2_max = 2;
}

message IdlingResponse {
  float idling = 1;
}

message TargetBoundResponse {
  float idling         = 1;
  float normal_max     = 2;
  float restricted_max = 3;
}

message IttrResponse {
  bool use = 1;
}

message GpsGearResponse {
  sint32          gear       = 1;  // which gear was just calibrated (0=N, 1-6), -1 if none
  repeated uint32 raw_values = 2;  // all raw values for the active transmission
  repeated sint32 gears      = 3;  // gear IDs corresponding to raw_values
}

message ConfigResponse {
  Config config   = 1;
  bool   changed  = 2;
  uint32 fs_used  = 3;  // LittleFS 使用バイト
  uint32 fs_total = 4;  // LittleFS 総バイト
}

message Response {
  uint32 id = 1;
  bool   ok = 2;
  oneof data {
    ConfigResponse            config             = 10;
    AppsMinResponse           apps_min           = 11;
    AppsMaxResponse           apps_max           = 12;
    TpsMinResponse            tps_min            = 13;
    TpsMaxResponse            tps_max            = 14;
    IdlingResponse            idling             = 15;
    TargetBoundResponse       target_bound       = 16;
    IttrResponse              ittr               = 17;
    EtcPlausibilityCheckFlags plausibility_flags = 18;
    EtcPid                    pid                = 19;
    EtcTargetCurve            target_curve       = 20;
    GpsGearResponse           gps_gear           = 21;
  }
}

message DeviceToHost {
  oneof payload {
    State        sensor   = 1;
    DebugMessage debug    = 2;
    Response     response = 3;
  }
}

// ---------------------------------------------------------------------
// Host -> Device
// ---------------------------------------------------------------------

message EtcMotorOffCmd {}

message SaveCmd {}

message SetAppsMinCmd {}

message SetAppsMaxCmd {}

message SetTpsMinCmd {}

message SetTpsMaxCmd {}

message SetIdlingCmd {}

message GetConfigCmd {}

message RebootCmd {}

message RevertCmd {}

message SetEtcManualCmd {}

message SetEtcTargetBoundCmd {
    // optional fields use proto3 explicit presence
  optional float idling         = 1;
  optional float normal_max     = 2;
  optional float restricted_max = 3;
}

message SetEtcPlausibilityFlagsCmd {
  optional bool apps    = 1;
  optional bool tps     = 2;
  optional bool apps1   = 3;
  optional bool apps2   = 4;
  optional bool tps1    = 5;
  optional bool tps2    = 6;
  optional bool target  = 7;
  optional bool bps     = 8;
  optional bool bps_tps = 9;
}

message SetIttrCmd {
  bool use = 1;
}

message SetEtcPidCmd {
  optional float k_p = 1;
  optional float k_i = 2;
  optional float k_d = 3;
}

message SetEtcTargetCurveCmd {
  // 結構細かい数字なので double
  optional double a4 = 1;
  optional double a3 = 2;
  optional double a2 = 3;
  optional double a1 = 4;
}

message EtcManualAdjustCmd {
  float amount = 1;
}

message SetConfigCmd {
  Config config = 1;
}

message SetRtcCmd {
  uint32 epoch = 1;  // Unix timestamp (seconds since 1970-01-01)
}

message FormatFsCmd {}  // LittleFS を消去し、現在の config を書き戻す (設定保持フォーマット)

// ETC 同定実験モード (docs/etc_experiment_mode_spec.md)。
// 開始条件 (モードノブ≠MOTOR_OFF・エンジン停止・車両静止・plausibility 正常・
// SD ログ動作中) はファーム側で検証し、満たさなければ ok=false を返す。
// シーケンス定義はファーム焼き込み:
//   POINT_DWELL: -5..105% を 1% 刻みで上り→下り (221 点)。静止判定→記録窓 1s
//   RELEASE:     -5..105% の 1% 刻み各点で保持→コースト (バネ戻り、静止で終了)
//   STEP:        0..100% の 10% 刻み 11 点×11 点から from==to を除く 110 ペア
message StartEtcExperimentCmd {
  enum Type {
    EXPERIMENT_UNSPECIFIED = 0;
    POINT_DWELL            = 1;
    RELEASE                = 2;
    STEP                   = 3;
  }
  Type type = 1;
}

message StopEtcExperimentCmd {}

// 制御入力の上書き (ベンチ用, docs/control_input_spec.md §3.3)。RAM のみで再起動で解除。
// 0x740 を受信している間は ok=false。上書き中に 0x740 を受信し始めたら自動で解除される。
message SetControlOverrideCmd {
  bool             enable     = 1;  // false = 上書きを解除
  // 未指定の項目は、上書き中なら今の上書き値を保ち、そうでなければ CAN 側の値 (未受信なら MOTOR_OFF / OFF)
  optional EtcMode etc_mode   = 2;
  optional bool    auto_shift = 3;
}  // 実行中の実験を中断 (manual 解除 → 通常制御へ復帰)

message SetGpsGearCmd {
  sint32 gear = 1;  // which gear position to calibrate (0=N, 1-6)
}

message SetClutchMinCmd {}  // 現在のクラッチ位置を clutch_min としてキャプチャ

message SetClutchMaxCmd {}  // 現在のクラッチ位置を clutch_max としてキャプチャ

message SetTransmissionTypeCmd {
  TransmissionType type = 1;  // IST / NORMAL を切替 (ギアテーブル・オートシフター挙動も切替わる)
}

message Command {
  uint32 id = 1;
  oneof body {
    EtcMotorOffCmd             etc_motor_off          = 10;
    SetAppsMinCmd              set_apps_min           = 11;
    SetAppsMaxCmd              set_apps_max           = 12;
    SetTpsMinCmd               set_tps_min            = 13;
    SetTpsMaxCmd               set_tps_max            = 14;
    SetIdlingCmd               set_idling             = 15;
    SetEtcTargetBoundCmd       set_etc_target_bound   = 16;
    SetEtcPlausibilityFlagsCmd set_plausibility_flags = 17;
    SetIttrCmd                 set_ittr               = 18;
    SetEtcPidCmd               set_etc_pid            = 19;
    SetEtcTargetCurveCmd       set_etc_target_curve   = 20;
    SetEtcManualCmd            set_etc_manual         = 21;
    EtcManualAdjustCmd         etc_manual_adjust      = 22;
    GetConfigCmd               get_config             = 23;
    SetConfigCmd               set_config             = 24;
    SaveCmd                    save                   = 25;
    RebootCmd                  reboot                 = 26;
    RevertCmd                  revert                 = 27;
    SetRtcCmd                  set_rtc                = 28;
    SetGpsGearCmd              set_gps_gear           = 29;
    SetClutchMinCmd            set_clutch_min         = 30;
    SetClutchMaxCmd            set_clutch_max         = 31;
    SetTransmissionTypeCmd     set_transmission_type  = 32;
    FormatFsCmd                format_fs              = 33;
    StartEtcExperimentCmd      start_etc_experiment   = 34;
    StopEtcExperimentCmd       stop_etc_experiment    = 35;
    SetControlOverrideCmd      set_control_override   = 36;
  }
}

message HostToDevice {
  oneof payload {
    Command command = 1;
  }
}
