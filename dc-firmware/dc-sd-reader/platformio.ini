; SD リーダーファーム。drive-controller (dc-main) とは別のイメージで、flash の 0x60080000 (512 KB) に置く (src/util/boot_layout.hpp)。
; 起動の選択は dc-boot (flash の先頭) がする。teensy_loader_cli 2.2 は 1 MB より先のアドレスを受け付けないので 1 MB 以内。
; USB は Teensy コアのものを止め (-DUSB_DISABLED)、ライブラリ Teensy4TinyUSB (PlatformIO Registry、github.com/ORyomei/Teensy4TinyUSB) で Mass Storage + CDC にする。
; dc-boot が SRC_GPR10 のフラグを見てここへ飛ぶ (docs/loop_nonblocking_spec.md §7.11)。
; SD カードを USB Mass Storage (+ CDC) で PC に見せるだけ。ETC / CAN / ログのコードは入っていない。
[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
board_build.ldscript = imxrt1062_t41_512k.ld  ; コアの imxrt1062_t41.ld の FLASH を ORIGIN 0x60080000 / 512 KB にしたもの
extra_scripts = pre:pre_build.py              ; spec/proto から nanopb を生成 (RebootCmd の受付)
lib_deps =
	nanopb/Nanopb@^0.4.8
	oryomei/Teensy4TinyUSB@^0.1.0
build_flags =
	-DPB_FIELD_32BIT
	-DUSB_DISABLED          ; Teensy コアの USB を止める (Teensy4TinyUSB が USB1 を使う。ライブラリの extra_script が確認する)
	-I../dc-main/src        ; constants.hpp (ピン)、util/boot_layout.hpp、serial/cobs.hpp / crc16.hpp を共有する
build_src_filter =
	+<*>
	+<../../dc-main/src/serial/cobs.cpp>
