; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
extra_scripts =
	pre:pre_build.py
	post:post_build.py   ; firmware.hex に dc-boot を合成 (起動の選択。§7.11)

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
; flash の 0x60010000〜 (448 KB) にリンクする (コアの imxrt1062_t41.ld の FLASH の ORIGIN / LENGTH だけ変更)。先頭 64 KB は ../dc-boot、
; 0x60080000〜 は ../dc-sd-reader (src/util/boot_layout.hpp)。はみ出したらリンクで落ちる (docs/loop_nonblocking_spec.md §7.11)
board_build.ldscript = imxrt1062_t41_main.ld
; upload は既定の teensy-gui (Windows の tool-teensy には teensy_loader_cli が無い。合成 hex は GUI でも CLI でも書ける)。
; リブート要求を送るので、console を Disconnect して COM を空けてから upload する (掴まれているとボタン待ちになる)。
; Linux でこの GUI が動かないときは tools/flash_all.py (CLI) で書く
monitor_speed = 115200
monitor_filters = direct
lib_deps =
	nanopb/Nanopb@^0.4.8
build_flags =
	-DPB_FIELD_32BIT
; Launch Control は凍結中。ON にすると launchController.begin() と
; FSM tick が有効化される。インスタンス自体は常にビルドに含まれる
; (コンパイラ腐敗検知のため)。
; -DLAUNCH_CONTROL_ENABLED

; ベンチ検証用 (DebugStallCmd を有効にする。docs/loop_nonblocking_spec.md §8)。本番には書き込まない
[env:teensy41_bench]
extends = env:teensy41
build_flags =
	${env:teensy41.build_flags}
	-DBENCH_DEBUG
