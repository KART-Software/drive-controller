; 起動の選択だけをする薄いファーム (docs/loop_nonblocking_spec.md §7.11)。flash の先頭 (0x60000000、ROM が飛んでくる唯一のイメージ)。
; SRC_GPR10 のフラグを見て dc-main (0x60010000) か dc-sd-reader (0x60080000) の IVT の entry へジャンプする。
; dc-main の post_build.py が自動でビルドして firmware.hex に合成するので、普段は意識しなくてよい。
[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
board_build.ldscript = imxrt1062_t41_boot.ld  ; コアの imxrt1062_t41.ld の FLASH を ORIGIN 0x60000000 / 64 KB にしたもの
build_flags =
	-I../dc-main/src   ; util/boot_layout.hpp (配置とフラグの約束) を共有する
